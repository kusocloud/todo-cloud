<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ToDo待辦事項V3</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  padding: 20px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  cursor: grab;
  transition: transform 0.2s;
}

.card.dragging {
  opacity: 0.6;
  transform: scale(1.05);
}

.high { border-left: 5px solid red; }
.medium { border-left: 5px solid orange; }
.low { border-left: 5px solid green; }

button {
  padding: 5px 10px;
  margin-top: 5px;
}

.done {
  opacity: 0.5;
  text-decoration: line-through;
  cursor: default;
}

.overdue {
  color: red;
  font-weight: bold;
}

.board {
  display: flex;
  gap: 20px;
}

.column {
  flex: 1;
  background: #eee;
  padding: 10px;
  border-radius: 10px;
  min-height: 400px;
  transition: background 0.2s;
}

.column.drag-over {
  background: #dfefff;
}

.column h2 {
  text-align: center;
}
</style>
</head>

<body>

<h1>📋 ToDo待辦事項V3</h1>
<button onclick="logout()">登出</button>

<div>
  <input id="content" placeholder="任務內容" required>
  <select id="priority">
    <option value="High">High</option>
    <option value="Medium">Medium</option>
    <option value="Low">Low</option>
  </select>
  <input type="date" id="dueDate">
  <button onclick="addTask()">新增</button>
</div>

<hr>

<div class="board">

  <div class="column" data-status="Todo">
    <h2>待辦事項</h2>
    <div id="todoList"></div>
  </div>

  <div class="column" data-status="Doing">
    <h2>進行中</h2>
    <div id="doingList"></div>
  </div>

  <div class="column" data-status="Done">
    <h2>已完成</h2>
    <div id="doneList"></div>
  </div>

</div>

<script type="module">

  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://uecxxpazkyfcrqswzbqm.supabase.co",
  "sb_publishable_Oc7KChg0knc-osKuDrxNmQ_XWAyrGsm"
);

const API = "/tasks";
let touchTaskId = null;

async function loadTasks() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = "/login.html";
    return;
  }

  const res = await fetch(API, {
    headers: {
      Authorization: `Bearer ${session.access_token}`
    }
  });

  const tasks = await res.json();

  document.getElementById("todoList").innerHTML = "";
  document.getElementById("doingList").innerHTML = "";
  document.getElementById("doneList").innerHTML = "";

  tasks.forEach(task => {
    const div = document.createElement("div");
    div.className = "card";
    div.dataset.id = task.id;
    div.draggable = true;

    div.innerHTML = `
      <strong>${task.content}</strong><br>
      狀態: ${task.status}<br>
      <button class="todoBtn">待辦中</button>
      <button class="doingBtn">進行中</button>
      <button class="doneBtn">已完成</button>
      <button class="deleteBtn">刪除</button>
    `;

    div.querySelector(".todoBtn").addEventListener("click", () => updateStatus(task.id, "Todo"));
    div.querySelector(".doingBtn").addEventListener("click", () => updateStatus(task.id, "Doing"));
    div.querySelector(".doneBtn").addEventListener("click", () => updateStatus(task.id, "Done"));
    div.querySelector(".deleteBtn").addEventListener("click", () => deleteTask(task.id));

    if (task.status === "Todo")
      document.getElementById("todoList").appendChild(div);
    else if (task.status === "Doing")
      document.getElementById("doingList").appendChild(div);
    else
      document.getElementById("doneList").appendChild(div);
  });
}

async function addTask() {
  const content = document.getElementById("content").value;
  const priority = document.getElementById("priority").value;
  const dueDate = document.getElementById("dueDate").value;

  const { data: { session } } = await supabase.auth.getSession();

  await fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${session.access_token}`
    },
    body: JSON.stringify({
      content,
      priority,
      status: "Todo",
      due_date: dueDate || null
    })
  });

  loadTasks();
}

async function updateStatus(id, status) {
  const { data: { session } } = await supabase.auth.getSession();

  await fetch(API + "/" + id, {
    method: "PATCH",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${session.access_token}`
    },
    body: JSON.stringify({ status })
  });

  loadTasks();
}

async function logout() {
  await supabase.auth.signOut();
  window.location.href = "/login.html";
}

async function deleteTask(id) {
  const { data: { session } } = await supabase.auth.getSession();

  await fetch(API + "/" + id, {
    method: "DELETE",
    headers: {
      Authorization: `Bearer ${session.access_token}`
    }
  });

  loadTasks();
}

document.querySelectorAll(".column").forEach(column => {
  column.addEventListener("dragover", (e) => {
    e.preventDefault();
    column.classList.add("drag-over");
  });

  column.addEventListener("dragleave", () => {
    column.classList.remove("drag-over");
  });

  column.addEventListener("drop", async (e) => {
    column.classList.remove("drag-over");
    const taskId = e.dataTransfer.getData("taskId");
    const newStatus = column.dataset.status;
    await updateStatus(taskId, newStatus);
  });
});

loadTasks();

window.addTask = addTask;
window.updateStatus = updateStatus;
window.deleteTask = deleteTask;
window.logout = logout;
</script>

</body>
</html>
