<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ToDo待辦事項V3</title>
<style>
body { font-family: Arial; background:#f4f4f4; padding:20px; }
h1 { margin-bottom:20px; }

.container { display:flex; gap:20px; }

.column {
  flex:1;
  background:#e9e9e9;
  padding:15px;
  border-radius:10px;
  min-height:400px;
}

.card {
  background:white;
  padding:12px;
  border-radius:8px;
  margin-bottom:10px;
  cursor:grab;
}

button { margin:3px 2px; }

.topbar { margin-bottom:15px; }
</style>
</head>

<body>

<h1>📋 ToDo待辦事項V3</h1>

<div class="topbar">
<button onclick="logout()">登出</button>
<br><br>
<input id="content" placeholder="任務內容">
<select id="priority">
  <option>Low</option>
  <option selected>Medium</option>
  <option>High</option>
</select>
<input type="date" id="dueDate">
<button onclick="addTask()">新增</button>
</div>

<div class="container">
  <div class="column" id="Todo" ondragover="allowDrop(event)" ondrop="drop(event,'Todo')">
    <h3>待辦事項</h3>
  </div>

  <div class="column" id="Doing" ondragover="allowDrop(event)" ondrop="drop(event,'Doing')">
    <h3>進行中</h3>
  </div>

  <div class="column" id="Done" ondragover="allowDrop(event)" ondrop="drop(event,'Done')">
    <h3>已完成</h3>
  </div>
</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://uecxxpazkyfcrqswzbqm.supabase.co",
  "sb_publishable_Oc7KChg0knc-osKuDrxNmQ_XWAyrGsm"
);

// ========= 驗證 =========
const { data:{session} } = await supabase.auth.getSession();
if (!session) location.href = "/login.html";

// ========= 登出 =========
window.logout = async function() {
  await supabase.auth.signOut();
  location.href = "/login.html";
}

// ========= 載入任務 =========
async function loadTasks() {

  const { data:{session} } = await supabase.auth.getSession();

  const res = await fetch("/tasks",{
    headers:{ Authorization:`Bearer ${session.access_token}` }
  });

  const tasks = await res.json();

  ["Todo","Doing","Done"].forEach(id=>{
    document.getElementById(id).innerHTML = "<h3>"+(
      id==="Todo"?"待辦事項":id==="Doing"?"進行中":"已完成"
    )+"</h3>";
  });

  tasks.forEach(task=>{
    const div = document.createElement("div");
    div.className="card";
    div.draggable=true;
    div.dataset.id=task.id;

    div.ondragstart = e=>{
      e.dataTransfer.setData("id",task.id);
    }

    div.innerHTML=`
      <strong>${task.content}</strong><br>
      優先度: ${task.priority}<br>
      到期日: ${task.due_date || "未設定"}<br>
      建立時間: ${task.created_at ? task.created_at.slice(0,10) : ""}<br>
      <button onclick="updateStatus(${task.id},'Todo')">待辦中</button>
      <button onclick="updateStatus(${task.id},'Doing')">進行中</button>
      <button onclick="updateStatus(${task.id},'Done')">已完成</button>
      <button onclick="deleteTask(${task.id})">刪除</button>
    `;

    document.getElementById(task.status).appendChild(div);
  });
}

window.loadTasks = loadTasks;

// ========= 新增 =========
window.addTask = async function(){
  const content=document.getElementById("content").value;
  const priority=document.getElementById("priority").value;
  const dueDate=document.getElementById("dueDate").value;

  const { data:{session} } = await supabase.auth.getSession();

  await fetch("/tasks",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:`Bearer ${session.access_token}`
    },
    body:JSON.stringify({
      content,
      priority,
      status:"Todo",
      due_date: dueDate||null
    })
  });

  document.getElementById("content").value="";
  loadTasks();
}

// ========= 更新 =========
window.updateStatus = async function(id,status){

  const { data:{session} } = await supabase.auth.getSession();

  await fetch(`/tasks/${id}`,{
    method:"PATCH",
    headers:{
      "Content-Type":"application/json",
      Authorization:`Bearer ${session.access_token}`
    },
    body:JSON.stringify({status})
  });

  loadTasks();
}

// ========= 刪除 =========
window.deleteTask = async function(id){

  const { data:{session} } = await supabase.auth.getSession();

  await fetch(`/tasks/${id}`,{
    method:"DELETE",
    headers:{ Authorization:`Bearer ${session.access_token}` }
  });

  loadTasks();
}

// ========= 拖曳 =========
window.allowDrop = function(ev){ ev.preventDefault(); }

window.drop = async function(ev,newStatus){
  ev.preventDefault();
  const id = ev.dataTransfer.getData("id");
  updateStatus(id,newStatus);
}

loadTasks();

</script>

</body>
</html>
